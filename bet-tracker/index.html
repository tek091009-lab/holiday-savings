<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#041423">
<title>Bet Tracker</title>
</head>
<body style="margin:0;background:#041423;color:#edf4ff;font-family:Arial,Helvetica,sans-serif">
<div id="boot" style="min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center">
  <div><strong style="font-size:18px">Bet Tracker</strong><div style="margin-top:8px;color:#8fa4bd;font-size:12px">Loading secure account…</div></div>
</div>
<script>
(async()=>{
  try{
    const files=[
      'app-01.b64','app-02.b64','app-03.b64','app-04.b64','app-05.b64','app-06.b64','app-07.b64',
      'rem-01.b64','rem-02.b64','rem-03.b64','rem-04.b64','rem-05.b64','rem-06.b64','rem-07.b64'
    ];
    const parts=await Promise.all(files.map(async f=>{
      const r=await fetch(f,{cache:'no-store'});
      if(!r.ok) throw new Error('asset');
      return r.text();
    }));
    const b64=parts.join('').replace(/\s+/g,'');
    const raw=atob(b64);
    const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    console.error(e);
    document.getElementById('boot').innerHTML='<div><h2 style="margin:0 0 8px">Bet Tracker</h2><div style="opacity:.7">Could not load the website. Refresh and try again.</div></div>';
  }
})();
</script>
</body>
</html>
